openapi: 3.1.0

info:
  title: PRDKit API
  description: >
    PRDKit by Halu Goods — a Product Requirements Document toolkit for
    generating, compiling, and exporting blueprints from PRDL specifications
    and natural language descriptions. Manage workspaces, projects, blueprints,
    AI providers, agents, templates, cost tracking, design inspirations, and
    generation job orchestration.
  version: 1.0.0
  contact:
    name: Halu Goods
    url: https://prdkit.halugoods.com
  license:
    name: Proprietary
    url: https://prdkit.halugoods.com/license

servers:
  - url: https://api.prdkit.halugoods.com/api/v1
    description: Production server
  - url: https://staging.api.prdkit.halugoods.com/api/v1
    description: Staging server
  - url: http://localhost:8000/api/v1
    description: Local development

paths:
  # ──────────────────────────────────────────────
  #  WORKSPACES
  # ──────────────────────────────────────────────
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List all workspaces
      description: Returns a paginated list of workspaces the authenticated user has access to.
      tags: [Workspaces]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Items per page
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createWorkspace
      summary: Create a new workspace
      description: Creates a workspace with the given name and optional description.
      tags: [Workspaces]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /workspaces/{ws}:
    get:
      operationId: getWorkspace
      summary: Get workspace details
      description: Retrieves a single workspace by its ID or slug.
      tags: [Workspaces]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
          description: Workspace ID or slug
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateWorkspace
      summary: Update a workspace
      description: Updates workspace metadata such as name, description, or settings.
      tags: [Workspaces]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
          description: Workspace ID or slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: Permanently deletes a workspace and all of its projects, blueprints, and data.
      tags: [Workspaces]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
          description: Workspace ID or slug
      responses:
        "200":
          description: Workspace deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #  PROJECTS
  # ──────────────────────────────────────────────
  /workspaces/{ws}/projects:
    get:
      operationId: listProjects
      summary: List projects in a workspace
      description: Returns all projects nested under the specified workspace.
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
          description: Workspace ID or slug
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, created_at, updated_at]
            default: created_at
          description: Sort field
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createProject
      summary: Create a project
      description: Creates a new project within a workspace.
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
          description: Workspace ID or slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /workspaces/{ws}/projects/{proj}:
    get:
      operationId: getProject
      summary: Get project details
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
          description: Workspace ID or slug
        - name: proj
          in: path
          required: true
          schema:
            type: string
          description: Project ID or slug
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateProject
      summary: Update a project
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
          description: Workspace ID or slug
        - name: proj
          in: path
          required: true
          schema:
            type: string
          description: Project ID or slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Permanently deletes a project and all of its blueprints.
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
          description: Workspace ID or slug
        - name: proj
          in: path
          required: true
          schema:
            type: string
          description: Project ID or slug
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #  BLUEPRINTS
  # ──────────────────────────────────────────────
  /workspaces/{ws}/projects/{proj}/blueprints:
    get:
      operationId: listBlueprints
      summary: List blueprints in a project
      tags: [Blueprints]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of blueprints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createBlueprint
      summary: Create a blueprint manually
      description: Creates a new blueprint by providing the blueprint data directly.
      tags: [Blueprints]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintCreate"
      responses:
        "201":
          description: Blueprint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /workspaces/{ws}/projects/{proj}/blueprints/{bpid}:
    get:
      operationId: getBlueprint
      summary: Get blueprint details
      tags: [Blueprints]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
        - name: bpid
          in: path
          required: true
          schema:
            type: string
          description: Blueprint ID
      responses:
        "200":
          description: Blueprint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateBlueprint
      summary: Update a blueprint
      tags: [Blueprints]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
        - name: bpid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintUpdate"
      responses:
        "200":
          description: Blueprint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteBlueprint
      summary: Delete a blueprint
      tags: [Blueprints]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
        - name: bpid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blueprint deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Blueprint: Compile ──
  /workspaces/{ws}/projects/{proj}/blueprints/compile:
    post:
      operationId: compileBlueprint
      summary: Compile PRDL to blueprint
      description: Takes PRDL (Product Requirements Description Language) source and compiles it into a structured blueprint.
      tags: [Blueprints]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [id, en]
            default: id
          description: "Output language for generated artifacts. Default: Indonesian (id). Use 'en' for English."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileRequest"
      responses:
        "200":
          description: Compiled blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Blueprint: Generate ──
  /workspaces/{ws}/projects/{proj}/blueprints/generate:
    post:
      operationId: generateBlueprint
      summary: Generate blueprint from natural language
      description: Uses an AI provider to generate a blueprint from a natural language description.
      tags: [Blueprints]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [id, en]
            default: id
          description: "Output language for generated artifacts. Default: Indonesian (id). Use 'en' for English."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generated blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "202":
          description: Generation queued as async job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Blueprint: Export ──
  /workspaces/{ws}/projects/{proj}/blueprints/{bpid}/export:
    get:
      operationId: exportBlueprint
      summary: Export blueprint in a specific format
      description: Exports the blueprint content in the requested format (markdown, openapi, prisma, zod, typescript, python, docker-compose, design-tokens).
      tags: [Blueprints]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
        - name: bpid
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum:
              - markdown
              - openapi
              - prisma
              - zod
              - typescript
              - python
              - docker-compose
              - design-tokens
          description: Export format
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [id, en]
            default: id
          description: "Output language for generated artifacts. Default: Indonesian (id). Use 'en' for English."
      responses:
        "200":
          description: Exported blueprint content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintExport"
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #  ARTIFACTS (read-only, nested under blueprint)
  # ──────────────────────────────────────────────
  /workspaces/{ws}/projects/{proj}/blueprints/{bpid}/artifacts:
    get:
      operationId: listArtifacts
      summary: List artifacts for a blueprint
      description: Returns artifacts generated from a compiled blueprint (e.g., generated files, documentation stubs).
      tags: [Artifacts]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
        - name: bpid
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
          description: Filter by artifact type
      responses:
        "200":
          description: List of artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /workspaces/{ws}/projects/{proj}/blueprints/{bpid}/artifacts/{aid}:
    get:
      operationId: getArtifact
      summary: Get artifact details
      tags: [Artifacts]
      security:
        - BearerAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: proj
          in: path
          required: true
          schema:
            type: string
        - name: bpid
          in: path
          required: true
          schema:
            type: string
        - name: aid
          in: path
          required: true
          schema:
            type: string
          description: Artifact ID
      responses:
        "200":
          description: Artifact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #  PROVIDERS
  # ──────────────────────────────────────────────
  /workspaces/{ws}/providers:
    get:
      operationId: listProviders
      summary: List AI providers
      description: Returns all configured AI providers for the workspace.
      tags: [Providers]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createProvider
      summary: Configure an AI provider
      description: Adds a new AI provider (e.g., OpenAI, Anthropic, Ollama) with its base URL and API key.
      tags: [Providers]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCreate"
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /workspaces/{ws}/providers/{pid}:
    get:
      operationId: getProvider
      summary: Get provider details
      tags: [Providers]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: pid
          in: path
          required: true
          schema:
            type: string
          description: Provider ID
      responses:
        "200":
          description: Provider details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateProvider
      summary: Update provider configuration
      tags: [Providers]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: ws
          in: path
          required: true
          schema:
            type: string
        - name: pid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteProvider
      summary: Delete a provider
