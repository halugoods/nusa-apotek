# ──────────────────────────────────────────────
#  COMPONENTS
# ──────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Workspace-level JWT authentication. Include the token in the
        Authorization header as `Bearer <token>`. Obtain a token via
        the authentication endpoint (external to this spec).
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Service-to-service API key authentication. Include the key in the
        X-API-Key header. Used for automated and server-to-server requests.

  responses:
    BadRequest:
      description: Bad Request — the request was malformed or contains invalid parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized — missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not Found — the requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation Error — request body failed schema validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    InternalError:
      description: Internal Server Error — an unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Shared / Utility ──
    ErrorResponse:
      type: object
      description: Standard error envelope.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g., `not_found`, `unauthorized`).
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              description: Optional additional error context.

    ValidationErrorResponse:
      type: object
      description: Validation error envelope with per-field errors.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, errors]
          properties:
            code:
              type: string
              enum: [validation_error]
            message:
              type: string
            errors:
              type: array
              description: List of individual field validation errors.
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: The field path that failed validation.
                  message:
                    type: string
                    description: Validation error message.
                  code:
                    type: string
                    description: Error code (e.g., `required`, `type_error`, `min_length`).

    DeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: Whether the resource was successfully deleted.
        id:
          type: string
          description: ID of the deleted resource.

    Pagination:
      type: object
      description: Pagination metadata.
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
          description: Total number of items across all pages.
        total_pages:
          type: integer

    # ── Workspaces ──
    Workspace:
      type: object
      description: A workspace is the top-level organizational unit.
      required: [id, name, slug, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Unique workspace identifier.
        name:
          type: string
          description: Human-readable workspace name.
        slug:
          type: string
          description: URL-friendly workspace slug.
        description:
          type: string
          description: Optional workspace description.
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkspaceSettings:
      type: object
      description: Workspace-level configuration.
      properties:
        default_provider_id:
          type: string
          description: Default AI provider ID for generation tasks.
        default_agent_id:
          type: string
          description: Default agent ID for generation tasks.
        rate_limits:
          type: object
          properties:
            requests_per_minute:
              type: integer
            tokens_per_minute:
              type: integer

    WorkspaceCreate:
      type: object
      description: Payload for creating a new workspace.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Workspace name.
        description:
          type: string
          maxLength: 1024
          description: Optional description.
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"

    WorkspaceUpdate:
      type: object
      description: Payload for updating a workspace.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
          nullable: true
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"

    WorkspaceList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Projects ──
    Project:
      type: object
      description: A project groups blueprints under a workspace.
      required: [id, workspace_id, name, slug, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary project metadata.
        blueprint_count:
          type: integer
          description: Number of blueprints in this project.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      description: Payload for creating a project.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        metadata:
          type: object
          additionalProperties: true

    ProjectUpdate:
      type: object
      description: Payload for updating a project.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    ProjectList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Blueprints ──
    Blueprint:
      type: object
      description: >
        A blueprint is the core PRDKit output — a structured representation
        of a product requirements document with entities, attributes,
        relationships, and constraints.
      required:
        - id
        - project_id
        - workspace_id
        - name
        - version
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        version:
          type: integer
          description: Monotonically incrementing version number.
        status:
          type: string
          enum: [draft, compiled, published, archived]
          description: Current lifecycle status of the blueprint.
        source:
          type: string
          description: The raw PRDL source if compiled from PRDL.
        content:
          type: object
          description: >
            The parsed blueprint content. Structure varies by blueprint type
            but generally includes entities, fields, relationships, and constraints.
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization.
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BlueprintCreate:
      type: object
      description: Payload for manually creating a blueprint.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 2048
        content:
          type: object
          description: Blueprint content (entities, fields, relationships).
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true

    BlueprintUpdate:
      type: object
      description: Payload for updating a blueprint.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 2048
          nullable: true
        content:
          type: object
        status:
          type: string
          enum: [draft, compiled, published, archived]
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true

    BlueprintList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Blueprint"
        pagination:
          $ref: "#/components/schemas/Pagination"

    CompileRequest:
      type: object
      description: Request to compile PRDL source into a blueprint.
      required: [source]
      properties:
        source:
          type: string
          description: Raw PRDL (Product Requirements Description Language) source code.
        name:
          type: string
          description: Optional name for the resulting blueprint. Auto-generated if omitted.
        tags:
          type: array
          items:
            type: string

    GenerateRequest:
      type: object
      description: Request to generate a blueprint from a natural language description using an AI provider.
      required: [description]
      properties:
        description:
          type: string
          minLength: 10
          maxLength: 10000
          description: Natural language description of the product requirements.
        provider_id:
          type: string
          description: >
            AI provider to use. If omitted, the workspace default provider is used.
        agent_id:
          type: string
          description: >
            Agent persona to use. If omitted, the workspace default agent is used.
        model:
          type: string
          description: Model override (e.g., `gpt-4o`, `claude-3-opus`).
        async:
          type: boolean
          default: false
          description: >
            If true, queues an async generation job and returns immediately
            with a job ID. Poll `/jobs/{id}` for status.
        tags:
          type: array
          items:
            type: string

    BlueprintExport:
      type: object
      description: Response containing the exported blueprint content.
      properties:
        format:
          type: string
          enum:
            - markdown
            - openapi
            - prisma
            - zod
            - typescript
            - python
            - docker-compose
            - design-tokens
        content:
          type: string
          description: The exported content as a string.
        filename:
          type: string
          description: Suggested filename (without extension).

    # ── Artifacts ──
    Artifact:
      type: object
      description: An artifact is a generated file or document produced from a blueprint.
      required: [id, blueprint_id, name, type, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        blueprint_id:
          type: string
          format: uuid
        name:
          type: string
          description: Artifact filename or title.
        type:
          type: string
          description: Artifact type (e.g., `documentation`, `schema`, `code`, `config`).
        content:
          type: string
          description: The artifact content.
        mime_type:
          type: string
          description: MIME type of the content (e.g., `text/markdown`, `application/json`).
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    ArtifactList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Providers ──
    Provider:
      type: object
      description: An AI provider configuration (e.g., OpenAI, Anthropic, Ollama, custom endpoint).
      required: [id, workspace_id, name, provider_type, base_url, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
          description: Human-readable name for this provider configuration.
        provider_type:
          type: string
          enum: [openai, anthropic, ollama, google, azure, custom]
          description: The provider platform.
        base_url:
          type: string
          format: uri
          description: Base URL for the provider API.
        models:
          type: array
          items:
            type: string
          description: Available model names for this provider.
        is_active:
          type: boolean
          default: true
        config:
          type: object
          description: Provider-specific configuration (e.g., org ID, project ID).
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProviderCreate:
      type: object
      description: Payload for configuring a new AI provider.
      required: [name, provider_type, base_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        provider_type:
          type: string
          enum: [openai, anthropic, ollama, google, azure, custom]
        base_url:
          type: string
          format: uri
        api_key:
          type: string
          description: >
            API key for the provider. Stored securely and never returned
            in API responses.
        models:
          type: array
          items:
            type: string
          description: >
            Optional list of models to make available. If omitted, the
            system will auto-discover models on first use.
        config:
          type: object
          additionalProperties: true
        is_active:
          type: boolean
          default: true

    ProviderUpdate:
      type: object
      description: Payload for updating a provider configuration.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        base_url:
          type: string
          format: uri
        api_key:
          type: string
          description: Update the API key.
        models:
          type: array
          items:
            type: string
        config:
          type: object
          additionalProperties: true
        is_active:
          type: boolean

    ProviderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Provider"

    ProviderDiscoverRequest:
      type: object
      description: Request to auto-discover models from a provider endpoint.
      required: [base_url, api_key]
      properties:
        base_url:
          type: string
          format: uri
          description: Provider API base URL (e.g., `https://api.openai.com/v1`).
        api_key:
          type: string
          description: API key for authentication to the provider.
        provider_type:
          type: string
          enum: [openai, anthropic, ollama, google, azure, custom]
          description: >
            Optional hint about the provider type. If omitted, the system
            attempts auto-detection.

    ProviderDiscoverResponse:
      type: object
      description: Response containing discovered model information.
      properties:
        provider_type:
          type: string
          description: Detected provider type.
        base_url:
          type: string
          format: uri
        models:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredModel"

    DiscoveredModel:
      type: object
      properties:
        id:
          type: string
          description: Model identifier (e.g., `gpt-4o`, `claude-3-opus-20240229`).
        name:
          type: string
          description: Human-readable model name.
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, completion, embedding, image_generation, vision]
          description: Model capabilities.

    # ── Agents ──
    Agent:
      type: object
      description: >
        An agent is an AI persona with a configured system prompt, model,
        and provider binding. Agents are used for blueprint generation
        and other AI-assisted tasks.
      required: [id, workspace_id, name, provider_id, model, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        provider_id:
          type: string
          format: uuid
          description: Bound provider configuration.
        model:
          type: string
          description: Model name for this agent.
        system_prompt:
          type: string
          description: System prompt that defines the agent's persona and behavior.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
          default: 0.7
        max_tokens:
          type: integer
          minimum: 1
          maximum: 128000
        tags:
          type: array
          items:
            type: string
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentCreate:
      type: object
      description: Payload for creating an agent.
      required: [name, provider_id, model]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        provider_id:
          type: string
          format: uuid
        model:
          type: string
        system_prompt:
          type: string
          maxLength: 32000
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          minimum: 1
          maximum: 128000
        tags:
          type: array
          items:
            type: string
        is_active:
          type: boolean
          default: true

    AgentUpdate:
      type: object
      description: Payload for updating an agent.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
          nullable: true
        provider_id:
          type: string
          format: uuid
        model:
          type: string
        system_prompt:
          type: string
          maxLength: 32000
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          minimum: 1
          maximum: 128000
        tags:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    AgentList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Templates ──
    Template:
      type: object
      description: >
        A template is a reusable blueprint scaffolding that can be used
        to bootstrap new projects with predefined structures.
      required: [id, workspace_id, name, category, content, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
          description: Template category (e.g., `web-app`, `mobile`, `api`, `data-pipeline`).
        content:
          type: object
          description: The template blueprint structure.
        tags:
          type: array
          items:
            type: string
        is_public:
          type: boolean
          default: false
          description: Whether this template is shared across the workspace.
        source_blueprint_id:
          type: string
          format: uuid
          nullable: true
          description: If templated from an existing blueprint, its ID.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TemplateCreate:
      type: object
      description: Payload for creating a template.
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        category:
          type: string
        content:
          type: object
          description: Blueprint structure to template.
        tags:
          type: array
          items:
            type: string
        is_public:
          type: boolean
          default: false
        source_blueprint_id:
          type: string
          format: uuid

    TemplateUpdate:
      type: object
      description: Payload for updating a template.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
          nullable: true
        category:
          type: string
        content:
          type: object
        tags:
          type: array
          items:
            type: string
        is_public:
          type: boolean

    TemplateList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Design Inspirations ──
    Inspiration:
      type: object
      description: >
        A design inspiration entry containing design patterns, color palettes,
        typography, and style metadata discovered from real-world sources.
      required: [id, workspace_id, title, url, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          format: uri
          description: Source URL.
        category:
          type: string
          description: Categorization (e.g., `landing-page`, `dashboard`, `e-commerce`).
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        design_data:
          type: object
          description: Structured design metadata.
          properties:
            color_palette:
              type: array
              items:
                type: string
              description: Array of hex color codes.
            typography:
              type: object
              properties:
                fonts:
                  type: array
                  items:
                    type: string
                heading_sizes:
                  type: object
                  additionalProperties:
                    type: string
            layout:
              type: string
              description: Layout pattern description.
            component_patterns:
              type: array
              items:
                type: string
              description: Identified UI component patterns.
        screenshot_url:
          type: string
          format: uri
          description: URL to a screenshot of the source.
        created_at:
          type: string
          format: date-time

    InspirationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Inspiration"
        pagination:
          $ref: "#/components/schemas/Pagination"

    InspirationDiscoverRequest:
      type: object
      description: Request to discover design inspiration from a URL.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: URL of the website or design to analyze.
        category:
          type: string
          description: Optional category hint.
        tags:
          type: array
          items:
            type: string
          description: Optional tags to attach to the discovered entry.
        async:
          type: boolean
          default: false
          description: >
            If true, queues an async discovery job and returns immediately
            with a job ID. Poll `/jobs/{id}` for status.

    # ── Jobs ──
    Job:
      type: object
      description: A generation or discovery job running in the background.
      required: [id, workspace_id, type, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [generate_blueprint, compile_blueprint, discover_inspiration, export_blueprint]
          description: The type of job.
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Progress percentage (0-100).
        request:
          type: object
          description: Snapshot of the job input parameters.
        result:
          type: object
          nullable: true
          description: Job output (present when status is `completed`).
        error:
          type: string
          nullable: true
          description: Error message (present when status is `failed`).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    AsyncJobResponse:
      type: object
      description: Response returned when an operation is queued for async execution.
      required: [id, status, type]
      properties:
        id:
          type: string
          format: uuid
          description: Job ID for status polling.
        status:
          type: string
          enum: [queued]
        type:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time

    JobList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Cost Tracking ──
    CostAggregate:
      type: object
      description: Aggregated cost summary for the workspace.
      properties:
        total_cost:
          type: number
          format: float
          description: Total cost in USD.
        total_requests:
          type: integer
          description: Total number of API requests.
        total_tokens:
          type: integer
          description: Total tokens consumed.
        by_provider:
          type: array
          items:
            $ref: "#/components/schemas/CostByProvider"
        timeframe:
          type: string
          example: "30d"
        currency:
          type: string
          default: USD

    CostByProvider:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        provider_name:
          type: string
        cost:
          type: number
          format: float
        requests:
          type: integer
        tokens:
          type: integer

    CostDailyBreakdown:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CostDailyEntry"
        summary:
          type: object
          properties:
            total_cost:
              type: number
              format: float
            total_requests:
              type: integer
            total_tokens:
              type: integer

    CostDailyEntry:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Calendar date.
        cost:
          type: number
          format: float
        requests:
          type: integer
        tokens:
          type: integer
        by_provider:
          type: array
          items:
            type: object
            properties:
              provider_id:
                type: string
                format: uuid
              cost:
                type: number
                format: float
              requests:
                type: integer
              tokens:
                type: integer

    # ── Knowledge ──
    KnowledgeEntry:
      type: object
      description: A knowledge-base entry containing reference information.
      required: [id, workspace_id, title, content, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
          description: The knowledge content (markdown-supported).
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          description: Source attribution (e.g., URL, document name).
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KnowledgeCreate:
      type: object
      description: Payload for adding a knowledge entry.
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        content:
          type: string
          minLength: 1
          maxLength: 100000
          description: Knowledge content (markdown-supported).
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          maxLength: 1024
        metadata:
          type: object
          additionalProperties: true

    KnowledgeList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeEntry"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Workflow ──
    Workflow:
      type: object
      description: >
        A workflow is a directed acyclic graph (DAG) of nodes and edges
        that represents the pipeline for blueprint generation, compilation,
        and export.
      required: [workspace_id, nodes, edges]
      properties:
        workspace_id:
          type: string
          format: uuid
        nodes:
          type: array
          description: Workflow nodes (steps in the pipeline).
          items:
            $ref: "#/components/schemas/WorkflowNode"
        edges:
          type: array
          description: Connections between workflow nodes.
          items:
            $ref: "#/components/schemas/WorkflowEdge"
        metadata:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time

    WorkflowNode:
      type: object
      description: A single node in the workflow DAG.
      required: [id, type, label]
      properties:
        id:
          type: string
          description: Unique node identifier within the workspace workflow.
        type:
          type: string
          enum:
            - input
            - prompt
            - compile
            - generate
            - export
            - transform
            - review
            - condition
            - output
          description: Node type.
        label:
          type: string
          description: Display label for the node.
        config:
          type: object
          description: Node-specific configuration.
          properties:
            provider_id:
              type: string
            agent_id:
              type: string
            model:
              type: string
            system_prompt:
              type: string
            template_id:
              type: string
            export_format:
              type: string
        position:
          type: object
          description: Visual position for canvas rendering.
          properties:
            x:
              type: number
            y:
              type: number

    WorkflowEdge:
      type: object
      description: A directed edge connecting two workflow nodes.
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          type: string
          description: Source node ID.
        target:
          type: string
          description: Target node ID.
        label:
          type: string
          description: Optional edge label.
        condition:
          type: string
          description: Optional condition expression for conditional edges.

    WorkflowSave:
      type: object
      description: Payload for saving workflow state.
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowEdge"
        metadata:
          type: object
          additionalProperties: true
